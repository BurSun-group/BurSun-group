</head>

          <li>🔗 VK: <a href="https://vk.com/bursunofficial" target="_blank">vk.com/bursunofficial</a></li>

let currentPage = 'home';

function clearHighlights() {
  const content = document.getElementById('content');
  if (!content) return;
  const marks = content.querySelectorAll('mark');
  marks.forEach(mark => {
      const parent = mark.parentNode;
      const text = document.createTextNode(mark.textContent);
      parent.replaceChild(text, mark);
      parent.normalize();
  });
}

function highlightText(searchTerm) {
  if (!searchTerm.trim()) return;
  const content = document.getElementById('content');
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
          if (node.parentElement && (node.parentElement.tagName === 'SCRIPT' || node.parentElement.tagName === 'STYLE')) {
              return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
      }
  });
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  textNodes.forEach(node => {
      const original = node.nodeValue;
      if (regex.test(original)) {
          const span = document.createElement('span');
          span.innerHTML = original.replace(regex, `<mark>$1</mark>`);
          node.parentNode.replaceChild(span, node);
      }
  });
}

function applySearchToCurrentPage() {
  const term = document.getElementById('searchInput').value.trim();
  clearHighlights();
  if (term !== '') {
      highlightText(term);
  }
}

function showPage(page) {
  currentPage = page;
  const contentDiv = document.getElementById('content');
  contentDiv.innerHTML = pagesContent[page];
  document.getElementById('searchResults').style.display = 'none';
  applySearchToCurrentPage();

  const term = document.getElementById('searchInput').value.trim();
  if (term) {
      setTimeout(() => {
          const firstMark = document.querySelector('#content mark');
          if (firstMark) {
              firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
      }, 100);
  }
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function searchAllPages(query) {
  const results = {};
  const lowerQuery = query.toLowerCase();
  for (let page in pagesContent) {
      const div = document.createElement('div');
      div.innerHTML = pagesContent[page];
      const text = div.textContent || div.innerText || '';
      const lowerText = text.toLowerCase();
      const snippets = [];
      let idx = lowerText.indexOf(lowerQuery);
      while (idx !== -1) {
          const start = Math.max(0, idx - 30);
          const end = Math.min(text.length, idx + query.length + 30);
          const snippet = text.substring(start, end);
          const regex = new RegExp(escapeRegExp(query), 'gi');
          const highlightedSnippet = snippet.replace(regex, '<mark>$&</mark>');
          snippets.push(highlightedSnippet);
          idx = lowerText.indexOf(lowerQuery, idx + 1);
      }
      if (snippets.length > 0) {
          results[page] = snippets;
      }
  }
  return results;
}

function getPageName(pageKey) {
  const names = {
      home: 'Главная',
      band: 'Участники',
      music: 'Музыка',
      merch: 'Мерч',
      support: 'Поддержать',
      contacts: 'Контакты'
  };
  return names[pageKey] || pageKey;
}

function displaySearchResults(results) {
  const container = document.getElementById('searchResults');
  if (Object.keys(results).length === 0) {
      container.style.display = 'none';
      return;
  }
  let html = '';
  for (let page in results) {
      html += `<div class="search-result-page">${getPageName(page)}</div>`;
      results[page].forEach(snippet => {
          html += `<div class="search-result-item" data-page="${page}">${snippet}</div>`;
      });
  }
  container.innerHTML = html;
  container.style.display = 'block';

  document.querySelectorAll('.search-result-item').forEach(item => {
      item.addEventListener('click', function() {
          const page = this.getAttribute('data-page');
          showPage(page);
      });
  });
}

const searchInput = document.getElementById('searchInput');
const searchResultsDiv = document.getElementById('searchResults');

if (searchInput) {
  searchInput.addEventListener('input', function(e) {
      const term = e.target.value.trim();
      clearHighlights();

      if (term === '') {
          searchResultsDiv.style.display = 'none';
          return;
      }

      highlightText(term);
      const allResults = searchAllPages(term);
      displaySearchResults(allResults);
  });

  document.addEventListener('click', function(event) {
      if (!searchInput.contains(event.target) && !searchResultsDiv.contains(event.target)) {
          searchResultsDiv.style.display = 'none';
      }
  });

  searchInput.addEventListener('focus', function() {
      const term = searchInput.value.trim();
      if (term !== '') {
          const allResults = searchAllPages(term);
          displaySearchResults(allResults);
      }
  });
}

const clearBtn = document.getElementById('searchClear');
if (clearBtn) {
  clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      clearHighlights();
      searchResultsDiv.style.display = 'none';
      searchInput.focus();
  });
}

showPage('home');
</script>
